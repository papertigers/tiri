name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust that rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  illumos:
    name: Test (illumos, OmniOS r151058)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/omnios-vm@v1
        with:
          # Comes with build-essential, for the linker and C compiler.
          release: r151058-build
          envs: CARGO_TERM_COLOR
          copyback: false
          # Keeps the VM with Rust installed, so later runs skip installing
          # it. The key follows rust-toolchain.toml, so a new Rust there
          # prepares the VM afresh.
          cache-after-prepare: true
          cache-after-prepare-key-suffix: rust-${{ hashFiles('rust-toolchain.toml') }}
          prepare: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            rustup toolchain install
          run: |
            . "$HOME/.cargo/env"
            cargo test
