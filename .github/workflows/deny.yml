name: cargo-deny

# Checks dependencies against deny.toml: RustSec advisories, licenses and
# sources. Runs weekly as well, since advisories get published while the
# code sits still.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
