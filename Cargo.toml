[package]
name = "tiri"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["serde"] }
font8x8 = "0.3.1"
libc = "0.2.190"
miniz_oxide = "0.9.1"
polling = "3"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rustix = { version = "1", features = ["event", "fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
