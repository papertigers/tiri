# cargo-deny checks dependencies for security advisories, licenses that
# don't fit tiri's MPL-2.0, and crates from outside crates.io. CI runs it
# on every push and pull request, and weekly for newly published advisories.
# Run it locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when tiri depends on them directly;
# one deep in the tree is the business of the crate that pulls it in.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common (hashbrown, windows-sys) and
# not worth failing CI over.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
